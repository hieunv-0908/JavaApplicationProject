<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="floating-orb"></div>
<div class="floating-orb"></div>
<div class="floating-orb"></div>
<div class="login-container">
    <div class="logo">
        <div class="medical-cross">+</div>
        <h2>Clinic System</h2>
    </div>

    <!-- Error and Success Messages -->
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>
    
    <div th:if="${message}" class="alert alert-success">
        <span th:text="${message}"></span>
    </div>

    <form class="login-form" th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" name="username" placeholder="Nhập username" required>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="Nhập password" required minlength="8">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember-me">
            <label for="remember">Nhớ tài khoản</label>
        </div>

        <button type="submit" class="login-button">Đăng nhập</button>
    </form>
    <br>
    <div class="login-link">
        <span>Chưa có tài khoản?</span>
        <a th:href="@{/register}" style="color: #2c7a7b; font-weight: 600; text-decoration: none;">Đăng ký</a>
    </div>
</div>
</body>
</html>
