<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="register-container">

    <div class="logo">
        <div class="medical-cross">+</div>
        <h2>Tạo tài khoản</h2>
    </div>

    <!-- Flash Messages -->
    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>
    
    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <form class="register-form" th:action="@{/register}" th:object="${userDtoRegister}" method="post" novalidate>

        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" th:field="*{username}" placeholder="Nhập username" required>
            <small class="error"
                   th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}">Username error</small>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Nhập email" required>
            <small class="error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">Email error</small>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" th:field="*{password}" placeholder="Nhập mật khẩu" required minlength="8">
            <small class="error"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">Password error</small>
        </div>

        <div class="form-group">
            <label>Xác nhận mật khẩu</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu" required>
            <small class="error"
                   th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}">Password confirmation error</small>
        </div>

        <button class="register-button">Đăng ký</button>

        <div class="login-link">
            <span>Đã có tài khoản?</span>
            <a th:href="@{/login}">Đăng nhập</a>
        </div>
    </form>
</div>
</body>
</html>
