<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>
        Tạo tài khoản bác sĩ
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI';
            background:#f5f7fa;
            padding:40px;
        }

        .container{

            max-width:800px;

            margin:auto;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:
                    0 5px 25px
                    rgba(0,0,0,0.1);
        }

        h1{

            margin-bottom:30px;

            color:#2c3e50;

            text-align:center;
        }

        .form-grid{

            display:grid;

            grid-template-columns:
                    repeat(2,1fr);

            gap:20px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{

            display:block;

            margin-bottom:8px;

            font-weight:600;

            color:#34495e;
        }

        input,
        select,
        textarea{

            width:100%;

            padding:12px;

            border:1px solid #dcdde1;

            border-radius:10px;

            font-size:15px;

            transition:0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus{

            border-color:#667eea;

            outline:none;

            box-shadow:
                    0 0 0 3px
                    rgba(102,126,234,0.15);
        }

        textarea{
            resize:vertical;
            min-height:120px;
        }

        .full-width{
            grid-column:1 / -1;
        }

        .submit-btn{

            width:100%;

            margin-top:20px;

            padding:14px;

            border:none;

            border-radius:12px;

            background:
                    linear-gradient(
                            135deg,
                            #667eea 0%,
                            #764ba2 100%
                    );

            color:white;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .submit-btn:hover{
            transform:translateY(-2px);
        }

        .error-box{

            background:#ffe6e6;

            color:#c0392b;

            padding:15px;

            border-radius:10px;

            margin-bottom:20px;
        }

        @media(max-width:768px){

            .form-grid{

                grid-template-columns:1fr;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        👨‍⚕️ Tạo tài khoản bác sĩ
    </h1>

    <div
            th:if="${error}"

            class="error-box">

        <span th:text="${error}">
        </span>

    </div>

    <form

            th:action=
                    "@{/admin/users/create-doctor}"

            method="post">

        <div class="form-grid">

            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Username
                </label>

                <input

                        type="text"

                        name="username"

                        required>

            </div>

            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>

                <input

                        type="password"

                        name="password"

                        minlength="8"

                        required>

            </div>

            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <input

                        type="email"

                        name="email"

                        required>

            </div>

            <!-- FULL NAME -->

            <div class="form-group">

                <label>
                    Họ tên bác sĩ
                </label>

                <input

                        type="text"

                        name="fullName"

                        required>

            </div>

            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Số điện thoại
                </label>

                <input

                        type="text"

                        name="phone"

                        required>

            </div>

            <!-- EXPERIENCE -->

            <div class="form-group">

                <label>
                    Số năm kinh nghiệm
                </label>

                <input

                        type="number"

                        name="experienceYears"

                        required>

            </div>

            <!-- DEGREE -->

            <div class="form-group full-width">

                <label>
                    Bằng cấp
                </label>

                <input

                        type="text"

                        name="degree"

                        placeholder=
                                "Ví dụ:
                        MD, PhD Tim Mạch">

            </div>

            <!-- SPECIALTY -->

            <div class="form-group full-width">

                <label>
                    Chuyên khoa
                </label>

                <select

                        name="specialtyId"

                        required>

                    <option value="">

                        -- Chọn chuyên khoa --

                    </option>

                    <option

                            th:each=
                                    "specialty : ${specialties}"

                            th:value=
                                    "${specialty.id}"

                            th:text=
                                    "${specialty.name}">

                    </option>

                </select>

            </div>

        </div>

        <button
                type="submit"

                class="submit-btn">

            ➕ Tạo tài khoản bác sĩ
        </button>
    </form>
</div>
</body>
</html>
