<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>
        Edit User
    </title>

    <style>

        body{
            font-family:Arial;
            background:#f5f7fa;
            padding:40px;
        }

        .container{

            max-width:600px;

            margin:auto;

            background:white;

            padding:30px;

            border-radius:16px;

            box-shadow:
                    0 5px 20px
                    rgba(0,0,0,0.1);
        }

        h1{
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input,
        select{

            width:100%;

            padding:12px;

            border:1px solid #ccc;

            border-radius:8px;
        }

        button{

            background:#667eea;

            color:white;

            border:none;

            padding:12px 20px;

            border-radius:8px;

            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        ✏️ Chỉnh sửa User
    </h1>

    <form

            th:action=
                    "@{/admin/users/update/{id}
            (id=${user.id})}"

            method="post">

        <div class="form-group">

            <label>
                Username
            </label>

            <input

                    type="text"

                    th:value="${user.username}"

                    readonly>

        </div>

        <div class="form-group">

            <label>
                Email
            </label>

            <input

                    type="email"

                    name="email"

                    th:value="${user.email}"

                    required>

        </div>

        <div class="form-group">

            <label>
                Role
            </label>

            <select name="role">

                <option

                        value="ADMIN"

                        th:selected=
                                "${user.role.name() == 'ADMIN'}">

                    ADMIN

                </option>

                <option

                        value="DOCTOR"

                        th:selected=
                                "${user.role.name() == 'DOCTOR'}">

                    DOCTOR

                </option>

                <option

                        value="PATIENT"

                        th:selected=
                                "${user.role.name() == 'PATIENT'}">

                    PATIENT

                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                Enabled
            </label>

            <select name="enabled">

                <option

                        value="true"

                        th:selected="${user.enabled}">

                    Hoạt động

                </option>

                <option

                        value="false"

                        th:selected="${!user.enabled}">

                    Bị khóa

                </option>

            </select>

        </div>

        <button type="submit">

            Cập nhật

        </button>

    </form>

</div>

</body>
</html>
