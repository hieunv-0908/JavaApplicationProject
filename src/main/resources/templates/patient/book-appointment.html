<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đặt lịch khám</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f5f7fb;
            padding:40px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:white;
            padding:35px;
            border-radius:14px;
            box-shadow:0 4px 20px rgba(0,0,0,0.1);
        }

        h1{
            margin-bottom:30px;
            color:#2c3e50;
            text-align:center;
        }

        .form-group{
            margin-bottom:22px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
            color:#34495e;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #dcdde1;
            border-radius:8px;
            font-size:15px;
        }

        textarea{
            resize:vertical;
            min-height:100px;
        }

        .submit-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#3498db;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .submit-btn:hover{
            background:#2980b9;
        }

        .alert{
            padding:15px;
            border-radius:8px;
            margin-bottom:20px;
        }

        .success{
            background:#d4edda;
            color:#155724;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
        }

        #slotContainer{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:10px;
        }

        .slot-btn{
            padding:10px 18px;
            border:none;
            border-radius:8px;
            background:#ecf0f1;
            cursor:pointer;
            transition:0.3s;
        }

        .slot-btn:hover{
            background:#3498db;
            color:white;
        }

        .slot-btn.active{
            background:#3498db;
            color:white;
        }

    </style>
</head>

<body>

<div class="container">


    <h1>Đặt lịch khám</h1>

    <!-- Success -->
    <div th:if="${success}"
         class="alert success">

        <span th:text="${success}">
        </span>

    </div>

    <!-- Error -->
    <div th:if="${error}"
         class="alert error">

        <span th:text="${error}">
        </span>

    </div>

    <form th:action="@{/patient/appointments/book}"
          method="post">

        <!-- Specialty -->
        <div class="form-group">

            <label>Chuyên khoa</label>

            <select id="specialtySelect"
                    required>

                <option value="">
                    -- Chọn chuyên khoa --
                </option>

                <option
                        th:each="specialty : ${specialties}"

                        th:value="${specialty.id}"

                        th:text="${specialty.name}">
                </option>

            </select>

        </div>

        <!-- Doctor -->
        <div class="form-group">

            <label>Bác sĩ</label>

            <select id="doctorSelect"
                    name="doctorId"
                    required>

                <option value="">
                    -- Chọn bác sĩ --
                </option>

            </select>

        </div>

        <!-- Date -->
        <div class="form-group">

            <label>Ngày khám</label>

            <input
                    type="date"

                    id="appointmentDate"

                    name="appointmentDate"

                    required>

        </div>

        <!-- Time Slots -->
        <div class="form-group">

            <label>Khung giờ còn trống</label>

            <div id="slotContainer">

            </div>

            <!-- hidden input -->
            <input
                    type="hidden"
                    id="appointmentTime"
                    name="appointmentTime"
                    required
            >

        </div>

        <!-- Note -->
        <div class="form-group">

            <label>Ghi chú</label>

            <textarea
                    name="note"
                    placeholder="Mô tả triệu chứng...">
            </textarea>

        </div>

        <button type="submit"
                class="submit-btn">
            Đặt lịch khám
        </button>

    </form>
    <br>
    <button class="submit-btn" style="background:#95a5a6">
        <a href="/patient/dashboard" style="text-decoration: none; color: white;">Quay lại trang chủ</a>
    </button>
</div>

<script>

    const specialtySelect =
        document.getElementById(
            "specialtySelect"
        );

    const doctorSelect =
        document.getElementById(
            "doctorSelect"
        );

    const appointmentDate =
        document.getElementById(
            "appointmentDate"
        );

    const slotContainer =
        document.getElementById(
            "slotContainer"
        );

    const appointmentTimeInput =
        document.getElementById(
            "appointmentTime"
        );

    /*
        LOAD DOCTORS
     */

    specialtySelect.addEventListener(
        "change",

        async function () {

            const specialtyId =
                this.value;

            doctorSelect.innerHTML =
                `
                <option value="">
                    -- Chọn bác sĩ --
                </option>
                `;

            slotContainer.innerHTML = "";

            if (!specialtyId) {
                return;
            }

            const response =
                await fetch(

                    `/patient/appointments/doctors-by-specialty?specialtyId=${specialtyId}`

                );

            const doctors =
                await response.json();

            doctors.forEach(doctor => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    doctor.id;

                option.textContent =
                    doctor.fullName;

                doctorSelect.appendChild(
                    option
                );

            });

        }
    );

    /*
        LOAD AVAILABLE SLOTS
     */

    async function loadAvailableSlots() {

        const doctorId =
            doctorSelect.value;

        const date =
            appointmentDate.value;

        slotContainer.innerHTML = "";

        appointmentTimeInput.value = "";

        if (!doctorId || !date) {
            return;
        }

        const response =
            await fetch(

                `/patient/appointments/available-slots?doctorId=${doctorId}&date=${date}`

            );

        const slots =
            await response.json();

        if (slots.length === 0) {

            slotContainer.innerHTML =
                `
                <p>
                    Không còn lịch trống
                </p>
                `;

            return;
        }

        slots.forEach(slot => {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "slot-btn";

            button.textContent =
                slot;

            button.addEventListener(
                "click",

                function () {

                    document
                        .querySelectorAll(
                            ".slot-btn"
                        )

                        .forEach(btn => {

                            btn.classList
                                .remove(
                                    "active"
                                );

                        });

                    this.classList
                        .add(
                            "active"
                        );

                    appointmentTimeInput
                        .value = slot;

                }
            );

            slotContainer
                .appendChild(button);

        });

    }

    doctorSelect.addEventListener(
        "change",
        loadAvailableSlots
    );

    appointmentDate.addEventListener(
        "change",
        loadAvailableSlots
    );

</script>

</body>
</html>
